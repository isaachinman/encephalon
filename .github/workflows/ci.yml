name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.context }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ubuntu-latest
            os: ubuntu-latest
            node: 24.15.0
          - context: macos-latest
            os: macos-latest
            node: 24.15.0
          - context: windows-latest
            os: windows-latest
            node: 24.15.0
          - context: ubuntu-current
            os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - if: matrix.context == 'ubuntu-current'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run benchmark:check
      - run: bun run build
      - run: git diff --exit-code
      - run: node ./scripts/check-package.ts
      - run: git diff --exit-code

  release:
    name: Release-equivalent package gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code
      - name: Check npm publish dry run
        run: node ./scripts/check-publish.ts
      - name: Check and retain release-equivalent package artifact
        id: package
        shell: bash
        run: |
          retained_tarball=$(node ./scripts/check-package.ts --retain-tarball package-artifacts)
          echo "tarball=$retained_tarball" >> "$GITHUB_OUTPUT"
      - run: git diff --exit-code
      - name: Upload trusted release-equivalent package artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: encephalon-npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
