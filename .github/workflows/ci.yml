name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.context }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ubuntu-latest
            os: ubuntu-latest
            node: 24.15.0
          - context: macos-latest
            os: macos-latest
            node: 24.15.0
          - context: windows-latest
            os: windows-latest
            node: 24.15.0
          - context: ubuntu-current
            os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - if: matrix.context == 'ubuntu-current'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun test scripts/workflow-policy.test.ts
      - run: bun run ./scripts/workflow-policy.ts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run benchmark:check
      - run: bun run build
      - run: git diff --exit-code HEAD
      - run: node ./scripts/check-package.ts
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
      - run: git diff --exit-code HEAD

  release:
    name: Release-equivalent package gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun test scripts/workflow-policy.test.ts
      - run: bun run ./scripts/workflow-policy.ts
      - run: bun run build
      - run: git diff --exit-code HEAD
      - name: Check npm publish dry run
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-publish.ts
      - name: Check and retain release-equivalent package artifact
        id: package
        shell: bash
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          retained_tarball=$(node ./scripts/check-package.ts --retain-tarball package-artifacts)
          echo "tarball=$retained_tarball" >> "$GITHUB_OUTPUT"
      - run: git diff --exit-code HEAD
      - name: Upload trusted release-equivalent package artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encephalon-npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
