name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select compatibility and platform coverage
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 2
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.selection.outputs.base }}
      head: ${{ steps.selection.outputs.head }}
      compatibility: ${{ steps.selection.outputs.compatibility }}
      historyTools: ${{ steps.selection.outputs.historyTools }}
      changedTests: ${{ steps.selection.outputs.changedTests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - id: selection
        run: node scripts/select-ci.ts

  source:
    name: source (${{ matrix.context }})
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ubuntu-latest
            node: 24.15.0
          - context: ubuntu-current
            node: 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - if: matrix.context == 'ubuntu-current'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - name: Source tests must not create build output
        run: node -e 'if (require("node:fs").existsSync("dist")) process.exit(1)'

  platform:
    name: platform (${{ matrix.context }})
    needs: selection
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: macos-latest
            os: macos-latest
            group: platform
          - context: windows-latest
            os: windows-latest
            group: platform-core
          - context: windows-cache
            os: windows-latest
            group: cache
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/test-ci.ts ${{ matrix.group }}
        env:
          CI_CHANGED_TESTS: ${{ needs.selection.outputs.changedTests }}

  tooling:
    name: Lint, types and cheap tool tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:tooling

  history:
    name: Historical release-tool regression
    needs: selection
    if: needs.selection.outputs.historyTools == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:history

  performance:
    name: performance (${{ matrix.shard }})
    timeout-minutes: 9
    needs: selection
    strategy:
      fail-fast: false
      matrix:
        shard: [large-gather, large-payload, large-maximum, large-preparation, large-reads, large-validation]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - name: Compare matched operation samples
        env:
          BASE_COMMIT: ${{ needs.selection.outputs.base }}
          CANDIDATE_COMMIT: ${{ needs.selection.outputs.head }}
        run: node scripts/benchmark-compare.ts "$BASE_COMMIT" "$CANDIDATE_COMMIT" performance-reports 20 ${{ matrix.shard }}
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ github.run_attempt }}-${{ matrix.shard }}
          path: performance-reports
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build exact package candidate
    needs: [source, tooling, selection]
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      tarball: ${{ steps.metadata.outputs.tarball }}
      sha256: ${{ steps.metadata.outputs.sha256 }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/check-worktree-clean.ts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - name: Check and retain exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --retain-tarball package-artifacts
      - run: node ./scripts/check-worktree-clean.ts --allow-package-artifacts
      - id: metadata
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package-metadata.ts
      - name: Upload exact package candidate
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encephalon-npm-package-${{ github.run_attempt }}
          path: |
            ${{ steps.metadata.outputs.tarball }}
            ${{ steps.metadata.outputs.tarball }}.metadata.json
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: candidate (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: package
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
            group: package
          - os: macos-latest
            node: 24.15.0
            group: package-platform
          - os: windows-latest
            node: 24.15.0
            group: package-platform
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: package-artifacts
          merge-multiple: true
      - run: node ./scripts/check-package-metadata.ts --restore
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
      - name: Recheck exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          CANDIDATE_TARBALL: ${{ needs.package.outputs.tarball }}
        shell: bash
        run: node ./scripts/check-package.ts --tarball "$CANDIDATE_TARBALL"
      - run: node scripts/test-ci.ts ${{ matrix.group }}

  release-checks:
    name: Release-equivalent package checks
    needs: [package, selection]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: package-artifacts
          merge-multiple: true
      - run: node ./scripts/check-package-metadata.ts --restore
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
      - name: Check published 0.3 compatibility
        if: needs.selection.outputs.compatibility == 'true'
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          CANDIDATE_TARBALL: ${{ needs.package.outputs.tarball }}
        run: node ./scripts/check-release-compatibility.ts "$CANDIDATE_TARBALL"
      - name: Check npm publish dry run
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          CANDIDATE_TARBALL: ${{ needs.package.outputs.tarball }}
        run: node ./scripts/check-publish.ts "$CANDIDATE_TARBALL"

  benchmark-smoke:
    name: Benchmark smoke checks
    needs: package
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: package-artifacts
          merge-multiple: true
      - run: node ./scripts/check-package-metadata.ts --restore
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
      - run: bun run benchmark:check

  verify:
    name: verify (${{ matrix.context }})
    needs: [source, platform, tooling, benchmark-smoke, performance, selection]
    if: always()
    timeout-minutes: 2
    strategy:
      matrix:
        context: [ubuntu-latest, macos-latest, windows-latest, ubuntu-current]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (!Object.values(JSON.parse(process.env.RESULTS)).every(job => job.result === "success")) process.exit(1)'
      - if: matrix.context == 'ubuntu-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: matrix.context == 'ubuntu-latest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - if: matrix.context == 'ubuntu-latest'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: performance-*
          path: performance-reports
      - if: matrix.context == 'ubuntu-latest'
        env:
          BASE_COMMIT: ${{ needs.selection.outputs.base }}
          CANDIDATE_COMMIT: ${{ needs.selection.outputs.head }}
        run: node scripts/benchmark-aggregate.ts performance-reports "$BASE_COMMIT" "$CANDIDATE_COMMIT" ${{ github.run_attempt }}
      - if: always() && matrix.context == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-${{ github.run_attempt }}
          path: performance-reports/comparison.json
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Release-equivalent package gate
    needs: [candidate, release-checks, verify, history, selection, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete selected coverage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const { history, selection, ...jobs } = JSON.parse(process.env.RESULTS);
            if (selection.result !== "success" || !Object.values(jobs).every(job => job.result === "success") ||
                !["true", "false"].includes(selection.outputs.historyTools) ||
                !["true", "false"].includes(selection.outputs.compatibility) ||
                history.result !== (selection.outputs.historyTools === "true" ? "success" : "skipped")) process.exit(1);
          '
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: package-artifacts
          merge-multiple: true
      - name: Verify the producer digest before retaining the successful candidate
        env:
          CANDIDATE_TARBALL: ${{ needs.package.outputs.tarball }}
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node -e 'const bytes = require("node:fs").readFileSync(process.env.CANDIDATE_TARBALL); if (require("node:crypto").createHash("sha256").update(bytes).digest("hex") !== process.env.CANDIDATE_SHA256) process.exit(1)'
      - name: Retain candidate for post-completion promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate-${{ github.run_attempt }}
          path: |
            ${{ needs.package.outputs.tarball }}
            ${{ needs.package.outputs.tarball }}.metadata.json
          if-no-files-found: error
          retention-days: 7
