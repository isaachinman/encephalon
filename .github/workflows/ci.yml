name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  correctness:
    name: correctness (${{ matrix.context }})
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ubuntu-latest
            os: ubuntu-latest
            node: 24.15.0
          - context: macos-latest
            os: macos-latest
            node: 24.15.0
          - context: windows-latest
            os: windows-latest
            node: 24.15.0
          - context: ubuntu-current
            os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - if: matrix.context == 'ubuntu-current'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run build
      - run: node scripts/test-ci.ts ${{ matrix.context == 'windows-latest' && 'main' || 'all' }}
      - run: bun run lint

  benchmark-smoke:
    name: Benchmark smoke checks
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run benchmark:check

  compatibility:
    name: compatibility (windows-latest, ${{ matrix.group }})
    # Admit the short Windows groups after the long jobs have entered the runner queue.
    needs: package
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        group: [compatibility-a, compatibility-b, compatibility-c, package, benchmark, benchmark-sessions, benchmark-report, benchmark-cli, cache]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node scripts/test-ci.ts ${{ matrix.group }}

  performance:
    name: performance (${{ matrix.shard }})
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard: [empty, small, medium, medium-maximum, large-gather, large-payload, large-maximum, large-preparation, large-reads, large-validation]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Compare matched operation samples
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ENCEPHALON_DIAGNOSE_COLD_HYDRATION: '1'
        run: node scripts/benchmark-compare.ts "$BASE_COMMIT" "$CANDIDATE_COMMIT" performance-reports 20 ${{ matrix.shard }}
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ github.run_attempt }}-${{ matrix.shard }}
          path: performance-reports
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify (${{ matrix.context }})
    needs: [correctness, compatibility, benchmark-smoke, performance]
    if: always()
    timeout-minutes: 1
    strategy:
      matrix:
        context: [ubuntu-latest, macos-latest, windows-latest, ubuntu-current]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (!Object.values(JSON.parse(process.env.RESULTS)).every(job => job.result === "success")) process.exit(1)'
      - if: matrix.context == 'ubuntu-latest'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: matrix.context == 'ubuntu-latest'
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - if: matrix.context == 'ubuntu-latest'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: performance-${{ github.run_attempt }}-*
          path: performance-reports
      - if: matrix.context == 'ubuntu-latest'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/benchmark-aggregate.ts performance-reports "$BASE_COMMIT" "$CANDIDATE_COMMIT" ${{ github.run_attempt }}
      - if: always() && matrix.context == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-${{ github.run_attempt }}
          path: performance-reports/comparison.json
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Build exact package candidate
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/check-worktree-clean.ts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - name: Check and retain exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --retain-tarball package-artifacts
      - run: node ./scripts/check-worktree-clean.ts --allow-package-artifacts
      - run: node ./scripts/check-package-metadata.ts
      - name: Upload exact package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encephalon-npm-package-${{ github.run_attempt }}
          path: |
            package-artifacts/encephalon-0.3.0.tgz
            package-artifacts/encephalon-0.3.0.tgz.metadata.json
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: candidate (Node ${{ matrix.node }})
    needs: package
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.15.0
          - 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: encephalon-npm-package-${{ github.run_attempt }}
          path: package-artifacts
      - run: node ./scripts/check-package-metadata.ts
      - name: Recheck exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --tarball package-artifacts/encephalon-0.3.0.tgz

  release-checks:
    name: Release-equivalent package checks
    needs: package
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: encephalon-npm-package-${{ github.run_attempt }}
          path: package-artifacts
      - run: node ./scripts/check-package-metadata.ts
      - name: Recheck exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --tarball package-artifacts/encephalon-0.3.0.tgz
      - name: Check published-oracle compatibility
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-release-compatibility.ts package-artifacts/encephalon-0.3.0.tgz
      - name: Check npm publish dry run
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-publish.ts package-artifacts/encephalon-0.3.0.tgz

  release:
    name: Release-equivalent package gate
    needs: [candidate, release-checks, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (!Object.values(JSON.parse(process.env.RESULTS)).every(job => job.result === "success")) process.exit(1)'
