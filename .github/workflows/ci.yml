name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.context }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ubuntu-latest
            os: ubuntu-latest
            node: 24.15.0
          - context: macos-latest
            os: macos-latest
            node: 24.15.0
          - context: windows-latest
            os: windows-latest
            node: 24.15.0
          - context: ubuntu-current
            os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - if: matrix.context == 'ubuntu-current'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run benchmark:check

  package:
    name: Build exact package candidate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./scripts/check-worktree-clean.ts
      - run: bun run test
      - run: node ./scripts/check-worktree-clean.ts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - name: Check and retain exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --retain-tarball package-artifacts
      - run: node ./scripts/check-worktree-clean.ts --allow-package-artifacts
      - run: node ./scripts/check-package-metadata.ts
      - name: Upload exact package candidate
        uses: actions/upload-artifact@v4
        with:
          name: encephalon-npm-package
          path: |
            package-artifacts/encephalon-0.3.0.tgz
            package-artifacts/encephalon-0.3.0.tgz.metadata.json
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: candidate (Node ${{ matrix.node }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.15.0
          - 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@v4
        with:
          name: encephalon-npm-package
          path: package-artifacts
      - run: node ./scripts/check-package-metadata.ts
      - name: Recheck exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --tarball package-artifacts/encephalon-0.3.0.tgz

  release:
    name: Release-equivalent package gate
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node ./scripts/check-generated-version.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node ./scripts/check-worktree-clean.ts
      - uses: actions/download-artifact@v4
        with:
          name: encephalon-npm-package
          path: package-artifacts
      - run: node ./scripts/check-package-metadata.ts
      - name: Recheck exact package candidate
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-package.ts --tarball package-artifacts/encephalon-0.3.0.tgz
      - name: Check published-oracle compatibility
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-release-compatibility.ts package-artifacts/encephalon-0.3.0.tgz
      - name: Check npm publish dry run
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: node ./scripts/check-publish.ts package-artifacts/encephalon-0.3.0.tgz
